name: Deploy Prompt Fairy

on:
  push:
    branches:
      - agent/v19-clean-baseline
    paths:
      - "_experiments/recipe-engine-v1/**"
      - ".github/workflows/deploy-ui-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish production site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out UI branch
        uses: actions/checkout@v5

      - name: Prepare production package
        shell: bash
        run: |
          mkdir -p _site
          cp -a _experiments/recipe-engine-v1/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
